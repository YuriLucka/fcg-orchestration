apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: 32Mi, cpu: 25m }
            limits: { memory: 128Mi }
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fcg
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
