apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi }
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fcg
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
