apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: users-db
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
          envFrom:
            - secretRef:
                name: users-db-secret
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1800"
          resources:
            requests:
              memory: 2Gi
              cpu: 250m
            limits:
              memory: 2560Mi
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: fcg
spec:
  selector:
    app: users-db
  ports:
    - port: 1433
      targetPort: 1433
