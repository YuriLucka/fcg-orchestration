services:
  rabbitmq:
    image: rabbitmq:3-management
    user: "0"
    environment:
      RABBITMQ_ERLANG_COOKIE: "fcg-secret-cookie"
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  users-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass1"
    ports: ["1401:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong_Pass1' -Q 'SELECT 1' -b -No 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_strong_Pass1' -Q 'SELECT 1' -b 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  catalog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass1"
    ports: ["1402:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong_Pass1' -Q 'SELECT 1' -b -No 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_strong_Pass1' -Q 'SELECT 1' -b 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: ../fcg-users-api
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
      users-db: { condition: service_healthy }
    environment:
      RabbitMq__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Server=users-db;Database=users;User Id=sa;Password=Your_strong_Pass1;TrustServerCertificate=true"
      JwtSettings__SecretKey: "fcg-fase2-shared-secret-key-please-change-32+chars"
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames.Client"
      ASPNETCORE_ENVIRONMENT: Development

  catalog-api:
    build:
      context: ../fcg-catalog-api
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
      catalog-db: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RabbitMq__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Server=catalog-db;Database=catalog;User Id=sa;Password=Your_strong_Pass1;TrustServerCertificate=true"
      MongoSettings__ConnectionString: "mongodb://mongo:27017"
      MongoSettings__Database: "fcg_catalog"
      RedisSettings__ConnectionString: "redis:6379"
      JwtSettings__SecretKey: "fcg-fase2-shared-secret-key-please-change-32+chars"
      JwtSettings__Issuer: "FiapCloudGames"
      JwtSettings__Audience: "FiapCloudGames.Client"
      ASPNETCORE_ENVIRONMENT: Development

  payments-api:
    build:
      context: ../fcg-payments-api
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RabbitMq__Host: rabbitmq
    ports: ["5003:8080"]

  notifications-api:
    build:
      context: ../fcg-notifications-api
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RabbitMq__Host: rabbitmq
    ports: ["5004:8080"]

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports: ["8000:8000", "8001:8001"]
    depends_on: [users-api, catalog-api]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [users-api, catalog-api]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    depends_on: [prometheus]

volumes:
  rabbitmq-data:
